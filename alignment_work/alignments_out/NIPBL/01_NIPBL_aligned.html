    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {

            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .info {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .controls {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        
        .scheme-selector {
            display: inline-block;
            margin-right: 20px;
        }
        
        label {
            font-weight: bold;
            margin-right: 8px;
        }
        
        select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .alignment-viewer {
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fafafa;
        }
        
        .alignment-table {
            border-collapse: collapse;
            font-size: 12px;
        }
        
        .seq-name {
            background-color: #f0f0f0;
            padding: 4px 8px;
            font-weight: bold;
            border-right: 2px solid #ccc;
            text-align: right;
            min-width: 150px;
            position: sticky;
            left: 0;
            z-index: 10;
        }
        
        .pos-ruler {
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 4px 2px;
            text-align: center;
            border-right: 2px solid #ccc;
            min-width: 150px;
            position: sticky;
            left: 0;
            z-index: 10;
        }
        
        .pos-label {
            padding: 2px 1px;
            font-size: 10px;
            text-align: center;
            min-width: 9px;
            display: inline-block;
        }
        
        .residue {
            display: inline-block;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            border: 1px solid #ddd;
            cursor: help;
            font-weight: bold;
            font-size: 11px;
        }
        
        .residue:hover {
            opacity: 0.8;
            border-color: #333;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        
        tr:hover {
            background-color: #f0f8ff;
        }
        
        td {
            padding: 2px;
            border-bottom: 1px solid #eee;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .legend {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .legend h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 5px;
        }
        
        .legend-color {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid #999;
            margin-right: 5px;
            vertical-align: middle;
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
    </style>

        const alnLen = 5028;
        const colorSchemes = {"clustal": {"A": "#80a0f0", "V": "#80a0f0", "I": "#80a0f0", "L": "#80a0f0", "M": "#80a0f0", "F": "#80a0f0", "W": "#80a0f0", "P": "#80a0f0", "K": "#f08080", "R": "#f08080", "H": "#f08080", "D": "#a0f060", "E": "#a0f060", "N": "#a0f060", "Q": "#a0f060", "S": "#a0f060", "T": "#a0f060", "C": "#f0a0f0", "G": "#ffa500", "Y": "#ffb6c1", "-": "#ffffff"}, "hydrophobicity": {"I": "#ff0000", "L": "#ff0000", "F": "#ff0000", "V": "#ff0000", "M": "#ff0000", "C": "#ff6600", "A": "#ff6600", "G": "#ff6600", "T": "#ff6600", "W": "#ff6600", "Y": "#ffcc00", "P": "#ffff00", "H": "#ffff00", "N": "#ffff00", "Q": "#ffff00", "S": "#ffff00", "D": "#99ccff", "E": "#99ccff", "K": "#0099ff", "R": "#0099ff", "-": "#ffffff"}, "chemical": {"A": "#ffcccc", "G": "#ffcccc", "V": "#ffcccc", "L": "#ffcccc", "I": "#ffcccc", "M": "#ffcccc", "F": "#ffcccc", "W": "#ffcccc", "P": "#ffcccc", "S": "#ccffcc", "T": "#ccffcc", "C": "#ccffcc", "N": "#ccffcc", "Q": "#ccffcc", "Y": "#ccffcc", "K": "#ccccff", "R": "#ccccff", "H": "#ccccff", "D": "#ffccff", "E": "#ffccff", "-": "#ffffff"}};
        let currentScheme = 'clustal';
        
        function getConservation(pos) {
            const column = alignmentData.map(s => s.seq[pos].toUpperCase()).filter(c => c !== '-');
            if (!column.length) return 0;
            const max = Math.max(...Object.values(
                column.reduce((acc, c) => { acc[c] = (acc[c] || 0) + 1; return acc; }, {})
            ));
            return max / column.length;
        }
        
        function getColor(aa, scheme, conservation = 1.0) {
            aa = aa.toUpperCase();
            if (scheme === 'identity') {
                if (aa === '-') return '#ffffff';
                if (conservation >= 0.8) return '#ff0000';
                if (conservation >= 0.6) return '#ff8800';
                if (conservation >= 0.4) return '#ffff00';
                return '#cccccc';
            }
            return colorSchemes[scheme][aa] || '#cccccc';
        }
        
        function renderAlignment() {
            const tbody = document.getElementById('alignment-tbody');
            tbody.innerHTML = '';
            
            // Position ruler
            let rulerRow = '<tr><td class="pos-ruler">';
            for (let i = 0; i < alnLen; i++) {
                if (i % 10 === 0) {
                    rulerRow += '<div class="pos-label">' + (i+1) + '</div>';
                } else {
                    rulerRow += '<div class="pos-label">·</div>';
                }
            }
            rulerRow += '</td></tr>';
            tbody.innerHTML += rulerRow;
            
            // Sequences
            alignmentData.forEach(seqObj => {
                let row = '<tr><td class="seq-name">' + seqObj.id + '</td><td>';
                for (let i = 0; i < alnLen; i++) {
                    const aa = seqObj.seq[i];
                    const conservation = getConservation(i);
                    const color = getColor(aa, currentScheme, conservation);
                    row += '<div class="residue" style="background-color: ' + color + '" title="Pos ' + (i+1) + ': ' + aa + ' (cons: ' + (conservation*100).toFixed(0) + '%)">' + aa + '</div>';
                }
                row += '</td></tr>';
                tbody.innerHTML += row;
            });
        }
        
        function changeScheme(scheme) {
            currentScheme = scheme;
            renderAlignment();
        }
        
        // Initial render
        renderAlignment();
